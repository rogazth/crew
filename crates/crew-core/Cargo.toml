[package]
name = "crew-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
crew-protocol = { path = "../crew-protocol" }
serde.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }
serde_json.workspace = true
rusqlite = { version = "0.40.2", features = ["bundled", "cache"], default-features = false }
uuid = { version = "1", features = ["v4"] }
libc = "0.2.189"
base64 = "0.23.1"
tokio = { workspace = true, features = ["io-util", "process"] }
# Connectors' OAuth and remote MCP calls. No native TLS and no system proxy:
# every connection goes through `connectors::net`'s resolver, which a proxy
# would bypass.
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json"] }
url = "2.5"
rand.workspace = true
aes = "0.8"
cbc = "0.1"
pbkdf2 = "0.12"
sha1 = "0.10"
sha2 = "0.10"
ignore = "=0.4.23"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode"] }
globset = "0.4.16"
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
grep-matcher = "0.1.9"

[features]
# The fake OAuth and MCP server (`connectors::fake_server`), for crewd's e2e.
fakes = []
# `trace::capture`: the events a test made, for tests (this crate's and crewd's) that prove a line is written.
capture = ["dep:tracing-subscriber"]

[dev-dependencies]
crew-core = { path = ".", features = ["capture"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
