# Builds Crew on a macOS arm64 runner and publishes the GitHub release.
# Started by the tag `npm run release` pushes; commits to master never run it.
# The release job runs in the `release` environment, which only v* tags (owner-only, by ruleset)
# and master reach, and which alone holds UPDATE_SIGNING_KEY.
# Actions are pinned to commits; the comment names the tag each one was.
# Run it by hand (Actions › Release › Run workflow, or
# `gh workflow run release.yml -f tag=v0.1.18`) to retry a tag whose publish failed.
#
# The daemons build in their own jobs, side by side, and the release job packages
# them. A tag run can only restore caches saved on master, never another tag's, so
# the weekly scheduled run builds the daemons on master to keep the Rust cache warm
# and publishes nothing.
name: Release

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish, e.g. v0.1.18
        required: true

permissions:
  contents: read

concurrency:
  group: release${{ github.event_name == 'schedule' && '-cache' || '' }}
  cancel-in-progress: false

jobs:
  daemon-mac:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.tag || github.ref }}

      # rust-toolchain.toml picks the toolchain. Only the scheduled run saves: a tag's cache is unreachable from the next tag.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name == 'schedule' }}

      # crew rides in the bundle beside crewd; Settings › General › Command line links to it.
      - run: cargo build --release -p crewd -p crew-cli

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daemon-mac
          path: |
            target/release/crewd
            target/release/crew
          if-no-files-found: error

  # The Linux daemons Crew installs on other machines ship inside the app.
  daemon-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.tag || github.ref }}

      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.arch }}
          save-if: ${{ github.event_name == 'schedule' }}

      # zig links against an old glibc, so the daemon runs on older distributions than the runner's.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: latest
          use-cache: false

      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-zigbuild

      - run: node scripts/crewd-linux.mjs ${{ matrix.arch }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daemon-linux-${{ matrix.arch }}
          path: target/linux/crewd-linux-${{ matrix.arch }}
          if-no-files-found: error

  release:
    if: github.event_name != 'schedule'
    needs: [daemon-mac, daemon-linux]
    runs-on: macos-15
    timeout-minutes: 30
    # Only this environment holds UPDATE_SIGNING_KEY.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.tag || github.ref }}
          # Full history and branches, for the master check below.
          fetch-depth: 0

      - name: Refuse tags that are not on master
        run: |
          if ! git merge-base --is-ancestor HEAD origin/master; then
            echo "::error::$(git rev-parse --short HEAD) is not on master. Cut releases from master with npm run release."
            exit 1
          fi

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24

      - run: npm ci

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: daemon-mac
          path: target/release

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: daemon-linux-*
          merge-multiple: true
          path: target/linux

      # Artifacts drop the executable bit.
      - run: chmod +x target/release/crewd target/release/crew target/linux/crewd-linux-*

      # The certificate scripts/signing-cert.mjs made, in a keychain of the run's own.
      # scripts/sign-mac.cjs signs with it; without it the app is signed ad hoc, and
      # macOS asks for the keychain password again after every update.
      - name: Load the signing certificate
        env:
          MAC_SIGNING_P12: ${{ secrets.MAC_SIGNING_P12 }}
          MAC_SIGNING_PASSWORD: ${{ secrets.MAC_SIGNING_PASSWORD }}
        run: |
          if [ -z "$MAC_SIGNING_P12" ]; then
            echo "::warning::No MAC_SIGNING_P12 secret: this release is signed ad hoc. Run node scripts/signing-cert.mjs --github once."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          echo "$MAC_SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$MAC_SIGNING_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          # codesign only finds an identity in a keychain on the search list.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -p codesigning "$keychain" | awk '/"Crew Code Signing"/ { print $2; exit }')"
          if [ -z "$identity" ]; then
            echo "::error::MAC_SIGNING_P12 holds no \"Crew Code Signing\" identity."
            exit 1
          fi
          echo "CREW_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "CREW_SIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build and publish
        run: node scripts/release-publish.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}

      - name: Remove the signing keychain
        if: always() && env.CREW_SIGN_KEYCHAIN != ''
        run: security delete-keychain "$CREW_SIGN_KEYCHAIN"
