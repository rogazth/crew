[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
authors = ["Gabriel Rodriguez"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", features = ["sink"] }
ts-rs = { version = "12", features = ["serde-json-impl"] }
rand = "0.9"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[profile.dev]
incremental = true

# Dependencies rarely change; compiling them optimised makes the dev build's
# terminal and SQLite paths behave like the release one.
[profile.dev.package."*"]
opt-level = 2
