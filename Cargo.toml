[workspace]
resolver = "2"
members = ["src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[profile.dev]
incremental = true

# Dependencies rarely change; compiling them optimised makes the dev build's
# terminal and SQLite paths behave like the release one.
[profile.dev.package."*"]
opt-level = 2
